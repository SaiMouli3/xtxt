name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...

  # The SDKs run the same fixtures in conformance/. If one of these fails while
  # the Go job passes, an implementation has drifted from the format.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: sdk/python

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
        working-directory: sdk/js

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: sdk/rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: sdk/rust
      - run: cargo test
        working-directory: sdk/rust

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test
        working-directory: sdk/java

  # Build the distributables and prove they actually contain the code. An
  # earlier wheel shipped empty because hatchling read the repo's .gitignore
  # relative to sdk/python and excluded the package; the tests all passed,
  # because they import from the source tree rather than the artifact.
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
        working-directory: sdk/c
      # C is the one implementation where a bug is a memory-safety bug, so the
      # sanitizers are part of the test story rather than an optional extra.
      # LeakSanitizer is on by default with ASan on Linux, which is why this
      # job matters more than the local run.
      - run: make asan
        working-directory: sdk/c

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: sdk/cpp
      - run: cmake --build build
        working-directory: sdk/cpp
      - run: ctest --test-dir build --output-on-failure
        working-directory: sdk/cpp

  # Integrations depend on the JS SDK via a file: link, so a change that breaks
  # the SDK's exports or types breaks these jobs before it reaches a user.
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Installed from the workspace root so xtxt-js resolves to the sibling
      # rather than needing to already exist on npm.
      - run: npm install
      - run: node --test --test-timeout=30000 test.js
        working-directory: integrations/mcp-server

  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
        working-directory: integrations/obsidian

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: editors/vscode
      - run: npx tsc --noEmit
        working-directory: editors/vscode
      - run: npm run build
        working-directory: editors/vscode
      # --no-dependencies: esbuild already bundles xtxt-js into out/extension.js,
      # and without it vsce walks the workspace-hoisted node_modules at the repo
      # root and tries to package the entire repository.
      - run: npx --yes @vscode/vsce package --no-dependencies --out /tmp/xtxt.vsix
        working-directory: editors/vscode

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and install the Python wheel
        run: |
          pip install build
          python -m build
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
        working-directory: sdk/python
      - name: The installed wheel must work outside its source tree
        run: |
          cd /tmp
          /tmp/venv/bin/python -c "
          import xtxt
          res = xtxt.parse('# T\n\n@task\nTitle: Ship it\nStatus: Done\n@endtask\n')
          assert [n.kind for n in res.doc.nodes] == ['heading', 'block'], res.doc.nodes
          tasks = xtxt.extract(res.doc)['tasks']
          assert tasks and tasks[0]['done'], tasks
          assert '<section class=\"record\"' in xtxt.render_html(res.doc)
          print('python package ok', xtxt.__version__)
          "

      - name: The npm tarball must contain every published entry point
        run: |
          npm pack
          tar tzf xtxt-js-*.tgz
          for f in package/xtxt.js package/chart.js package/README.md package/LICENSE; do
            tar tzf xtxt-js-*.tgz | grep -qx "$f" || { echo "missing $f"; exit 1; }
          done
        working-directory: sdk/js
