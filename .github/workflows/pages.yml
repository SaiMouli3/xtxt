name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The demo runs the real SDK and the real stylesheet rather than copies,
      # so the page can never drift from what the CLI produces.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp sdk/js/xtxt.js sdk/js/chart.js _site/
          cp assets/xtxt.css assets/chart-runtime.js _site/
      # The documentation is written in XTXT and rendered by the CLI, so the
      # site cannot describe behaviour the tool does not have.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build the documentation site
        run: |
          cp assets/docs.css _site/
          go run ./tools/docsite docs/pages _site/docs
          # The old single-page guide keeps working for anyone who linked it.
          go run ./cmd/xtxt export docs/guide.xtxt html --full --interactive -o _site/guide.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
