name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The demo runs the real SDK and the real stylesheet rather than copies,
      # so the page can never drift from what the CLI produces.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp sdk/js/xtxt.js sdk/js/chart.js _site/
          cp assets/xtxt.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
