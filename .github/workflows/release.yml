name: release
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: no API token to store or rotate. Configure the
    # publisher once at https://pypi.org/manage/account/publishing/ with
    # owner SaiMouli3, repo xtxt, workflow release.yml, environment pypi.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  npm:
    needs: test
    runs-on: ubuntu-latest
    # Skipped until NPM_TOKEN exists, so a release is never red for a reason
    # that has nothing to do with the code. See RELEASING.md.
    if: ${{ github.repository == 'SaiMouli3/xtxt' }}
    steps:
      - id: token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::NPM_TOKEN is not set; skipping the npm publish."
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - if: steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public
        working-directory: sdk/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes after npm: xtxt-mcp depends on xtxt-js at a real version, so the
  # SDK has to exist on the registry before this can resolve.
  npm-mcp:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - id: token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::NPM_TOKEN is not set; skipping the xtxt-mcp publish."
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - if: steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public
        working-directory: integrations/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - id: token
        run: echo "present=${{ secrets.CARGO_REGISTRY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish."
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      # The crate reads ../../conformance in its tests only, so packaging must
      # not try to bundle it.
      - if: steps.token.outputs.present == 'true'
        run: cargo publish --no-verify
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
